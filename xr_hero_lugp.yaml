    Dma.Request4: USART2_RX
    Dma.Request5: USART3_TX
    Dma.Request6: USART3_RX
    Dma.Request7: UART5_TX
    Dma.Request8: USART1_RX
    Dma.Request9: USART1_TX
    Bdma.Request0: SPI6_TX
