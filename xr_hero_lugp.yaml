GPIO:
  PC0:
    Label: ACC_CS
    Signal: GPIO_Output
  PC13:
    Label: Ctrl24V_2
    Signal: GPIO_Output
  PC14:
    Signal: GPIO_Output
  PC15:
    Label: Ctrl5V
    Signal: GPIO_Output
  PC3:
    Label: GYRO_CS
    Signal: GPIO_Output
  PE10:
    Label: ACC_INT
    Signal: GPXTI10
    GPXTI: true
  PE12:
    Label: GYRO_INT
    Signal: GPXTI12
    GPXTI: true
Peripherals:
  TIM:
    TIM12:
      Period: 1000-1
      Prescaler: 275-1
      Channels:
        CH2:
          Label: PB15
          PWM: true
          Complementary: false
          DutyCycle: null
    TIM23:
      Period: 999
      Prescaler: 274
    TIM3:
      Period: 299
      Prescaler: 0
      Channels:
        CH4:
          Label: PB1
          PWM: true
          Complementary: false
          DutyCycle: null
    TIM7:
      Period: 124
      Prescaler: 274
  ADC:
    ADC3:
      ContinuousMode: false
      RegularConversions:
      - ADC_CHANNEL_TEMPSENSOR
      Channels:
      - ADC_CHANNEL_TEMPSENSOR
      DMA: DISABLE
  SPI:
    SPI2:
      BaudRate: 10.0 MBits/s
      Direction: SPI_DIRECTION_2LINES
      CLKPolarity: SPI_POLARITY_HIGH
      CLKPhase: SPI_PHASE_2EDGE
      dma:
        dma_rx: &id001
          request_id: '0'
          peripheral: SPI2_RX
          dma_type: DMA
          stream: DMA1_Stream0
          direction: MEMORY
          periph_inc: false
          mem_inc: true
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: VeryHigh
          fifo: Disabled
          direction_full: periph_to_memory
        dma_tx: &id002
          request_id: '1'
          peripheral: SPI2_TX
          dma_type: DMA
          stream: DMA1_Stream1
          direction: PERIPH
          periph_inc: false
          mem_inc: true
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: High
          fifo: Disabled
          direction_full: memory_to_periph
      DMA_RX: ENABLE
      DMA_RX_TYPE: DMA
      DMA_TX: ENABLE
      DMA_TX_TYPE: DMA
    SPI6:
      BaudRate: 6.0 MBits/s
      Direction: SPI_DIRECTION_2LINES_TXONLY
      CLKPolarity: SPI_POLARITY_LOW
      CLKPhase: SPI_PHASE_2EDGE
      dma:
        dma_tx: &id011
          request_id: '0'
          peripheral: SPI6_TX
          dma_type: BDMA
          stream: BDMA_Channel0
          direction: PERIPH
          periph_inc: false
          mem_inc: true
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: Low
          direction_full: memory_to_periph
      DMA_TX: ENABLE
      DMA_TX_TYPE: BDMA
  USART:
    UART5:
      BaudRate: 100000
      WordLength: WORDLENGTH_9B
      Parity: PARITY_EVEN
      StopBits: UART_STOPBITS_1
      Mode: Asynchronous
      dma:
        dma_rx: &id003
          request_id: '2'
          peripheral: UART5_RX
          dma_type: DMA
          stream: DMA1_Stream2
          direction: MEMORY
          periph_inc: false
          mem_inc: true
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: Low
          fifo: Disabled
          direction_full: periph_to_memory
        dma_tx: &id004
          request_id: '7'
          peripheral: UART5_TX
          dma_type: DMA
          stream: DMA1_Stream3
          direction: PERIPH
          periph_inc: false
          mem_inc: true
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: Low
          fifo: Disabled
          direction_full: memory_to_periph
      DMA_RX: ENABLE
      DMA_RX_TYPE: DMA
      DMA_TX: ENABLE
      DMA_TX_TYPE: DMA
    USART1:
      BaudRate: 115200
      WordLength: WORDLENGTH_8B
      Parity: PARITY_NONE
      StopBits: UART_STOPBITS_1
      Mode: Asynchronous
      dma:
        dma_rx: &id005
          request_id: '8'
          peripheral: USART1_RX
          dma_type: DMA
          stream: DMA1_Stream5
          direction: MEMORY
          periph_inc: false
          mem_inc: true
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: High
          fifo: Disabled
          direction_full: periph_to_memory
        dma_tx: &id006
          request_id: '9'
          peripheral: USART1_TX
          dma_type: DMA
          stream: DMA2_Stream5
          direction: PERIPH
          periph_inc: false
          mem_inc: true
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: High
          fifo: Disabled
          direction_full: memory_to_periph
      DMA_RX: ENABLE
      DMA_RX_TYPE: DMA
      DMA_TX: ENABLE
      DMA_TX_TYPE: DMA
    USART2:
      BaudRate: 2000000
      WordLength: WORDLENGTH_9B
      Parity: PARITY_EVEN
      StopBits: UART_STOPBITS_1
      Mode: Asynchronous
      dma:
        dma_rx: &id007
          request_id: '4'
          peripheral: USART2_RX
          dma_type: DMA
          stream: DMA2_Stream0
          direction: MEMORY
          periph_inc: false
          mem_inc: true
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: High
          fifo: Disabled
          direction_full: periph_to_memory
        dma_tx: &id008
          request_id: '3'
          peripheral: USART2_TX
          dma_type: DMA
          stream: DMA1_Stream7
          direction: PERIPH
          periph_inc: false
          mem_inc: true
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: High
          fifo: Disabled
          direction_full: memory_to_periph
      DMA_RX: ENABLE
      DMA_RX_TYPE: DMA
      DMA_TX: ENABLE
      DMA_TX_TYPE: DMA
    USART3:
      BaudRate: 114514
      WordLength: WORDLENGTH_8B
      Parity: PARITY_NONE
      StopBits: UART_STOPBITS_1
      Mode: Asynchronous
      dma:
        dma_rx: &id009
          request_id: '6'
          peripheral: USART3_RX
          dma_type: DMA
          stream: DMA2_Stream2
          direction: MEMORY
          periph_inc: false
          mem_inc: true
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: High
          fifo: Disabled
          direction_full: periph_to_memory
        dma_tx: &id010
          request_id: '5'
          peripheral: USART3_TX
          dma_type: DMA
          stream: DMA1_Stream6
          direction: PERIPH
          periph_inc: false
          mem_inc: true
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: High
          fifo: Disabled
          direction_full: memory_to_periph
      DMA_RX: ENABLE
      DMA_RX_TYPE: DMA
      DMA_TX: ENABLE
      DMA_TX_TYPE: DMA
  FDCAN:
    FDCAN1:
      NominalPrescaler: 1.0
      FrameFormat: FDCAN_FRAME_CLASSIC
      StdFilters: 4
      ExtFilters: 4
      BaudRate: '1000000'
    FDCAN2:
      NominalPrescaler: 1.0
      FrameFormat: FDCAN_FRAME_CLASSIC
      StdFilters: 4
      ExtFilters: 4
      BaudRate: '1000000'
    FDCAN3:
      NominalPrescaler: 1.0
      FrameFormat: FDCAN_FRAME_CLASSIC
      StdFilters: 1
      ExtFilters: 1
      BaudRate: '1000000'
  USB:
    USB_DEVICE:
      CLASS_NAME_HS: CDC
      IPParameters:
      - VirtualMode
      - VirtualModeHS
      - CLASS_NAME_HS
      - USBD_LPM_ENABLED
      USBD_LPM_ENABLED: '1'
      VirtualMode: Cdc
      VirtualModeHS: Cdc_HS
    USB_OTG_HS:
      IPParameters:
      - VirtualMode-Device_Only_FS
      profiles:
        Device_Only_FS:
          VirtualMode: Device_Only_FS
  I2C: {}
DMA:
